name: "Terraform CI/CD"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-ci:
    name: "Terraform Lint, Validate and Plan"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::123456789012:role/github-actions-oidc-runner"
          aws-region: "ap-northeast-1"

      - name: Authenticate to Google Cloud (OIDC via WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/123456789012/locations/global/workloadIdentityPools/multi-cloud-secure-pool/providers/github-provider"
          service_account: "wif-executor-sa@multi-cloud-secure-ai-project.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          echo "Executing: terraform init"
          echo "Executing: terraform plan"
